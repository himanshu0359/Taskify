databases:
  - name: taskify-db
    databaseName: taskify
    user: taskify
    plan: free

services:
  - type: web
    name: taskify-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taskify-db
          property: connectionString
      - key: TASKIFY_SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: TASKIFY_ADMIN_KEY
        generateValue: true
